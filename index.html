<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pantheon — Aethon</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: #1a2830;
        font-family: Georgia, 'Times New Roman', serif;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d1418;
        color: #c8bfb0;
        font-style: italic;
        font-size: 1.1rem;
        letter-spacing: 0.05em;
        z-index: 100;
        transition: opacity 0.6s ease;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #camera-hint {
        position: fixed;
        bottom: 72px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 420px;
        padding: 8px 16px;
        font-size: 0.85rem;
        font-style: italic;
        color: rgba(200, 190, 175, 0.7);
        text-align: center;
        pointer-events: none;
        z-index: 40;
        opacity: 0;
        transition: opacity 0.8s ease;
      }
      #camera-hint.visible {
        opacity: 1;
      }
      #game.pointer-locked {
        cursor: none;
      }
    </style>
  </head>
  <body>
    <div id="loading">Remembering the world…</div>
    <p id="camera-hint">Click the world to capture the mouse; move the mouse to look around. Press Escape to release.</p>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
