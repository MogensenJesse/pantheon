<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pantheon — Aethon</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/ui/kit/tokens.css" />
    <link rel="stylesheet" href="/src/ui/kit/screens.css" />
  </head>
  <body>
    <section id="map-select" aria-label="Choose a map">
      <h1>Pantheon</h1>
      <p id="map-select-status">Loading maps…</p>
      <div id="map-select-list"></div>
    </section>
    <div id="loading" aria-live="polite">
      <div class="loading-panel">
        <p id="loading-message">Waking the renderer from its slumber…</p>
        <div
          class="loading-bar"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          aria-labelledby="loading-message"
        >
          <div id="loading-bar-fill"></div>
        </div>
      </div>
    </div>
    <p id="camera-hint">Click the world to capture the mouse; move the mouse to look around. Press Escape to release.</p>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
