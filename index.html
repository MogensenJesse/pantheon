<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pantheon — Aethon</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: #1a2830;
        font-family: Georgia, 'Times New Roman', serif;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d1418;
        color: #c8bfb0;
        font-style: italic;
        font-size: 1.1rem;
        letter-spacing: 0.05em;
        z-index: 100;
        transition: opacity 0.6s ease;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #map-select {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem;
        background: #0d1418;
        color: #c8bfb0;
        z-index: 110;
      }
      #map-select.visible {
        display: flex;
      }
      #map-select h1 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: normal;
        letter-spacing: 0.06em;
      }
      #map-select-status {
        margin: 0;
        font-size: 0.95rem;
        font-style: italic;
        opacity: 0.85;
        text-align: center;
        max-width: 32rem;
      }
      #map-select-list {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
        max-width: 720px;
      }
      .map-select-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.25rem;
        min-width: 160px;
        padding: 0.85rem 1.1rem;
        border: 1px solid rgba(200, 190, 175, 0.25);
        border-radius: 4px;
        background: rgba(26, 40, 48, 0.6);
        color: #e8e0d4;
        font-family: inherit;
        cursor: pointer;
        transition: border-color 0.2s ease, background 0.2s ease;
      }
      .map-select-card:hover {
        border-color: rgba(200, 190, 175, 0.55);
        background: rgba(40, 58, 68, 0.85);
      }
      .map-select-card__name {
        font-size: 1rem;
      }
      .map-select-card__id {
        font-size: 0.75rem;
        opacity: 0.65;
        font-style: italic;
      }
      #camera-hint {
        position: fixed;
        bottom: 72px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 420px;
        padding: 8px 16px;
        font-size: 0.85rem;
        font-style: italic;
        color: rgba(200, 190, 175, 0.7);
        text-align: center;
        pointer-events: none;
        z-index: 40;
        opacity: 0;
        transition: opacity 0.8s ease;
      }
      #camera-hint.visible {
        opacity: 1;
      }
      #game.pointer-locked {
        cursor: none;
      }
    </style>
  </head>
  <body>
    <div id="map-select" aria-label="Choose a map">
      <h1>Pantheon</h1>
      <p id="map-select-status">Loading maps…</p>
      <div id="map-select-list"></div>
    </div>
    <div id="loading">Remembering the world…</div>
    <p id="camera-hint">Click the world to capture the mouse; move the mouse to look around. Press Escape to release.</p>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
