<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pantheon — Map Editor</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: #2a3238;
        font-family: system-ui,Segoe UI,sans-serif;
        font-size: 13px;
        color: #e8e0d4;
      }
      #editor {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1a2228;
        color: #c8bfb0;
        font-family: Georgia,serif;
        font-style: italic;
        z-index: 200;
      }
      #loading.hidden {
        display: none;
      }
      #editor-ui {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        pointer-events: none;
      }
      #editor-ui .editor-bar {
        pointer-events: auto;
      }
      .editor-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px 14px;
        padding: 8px 12px;
        background: rgba(20, 26, 32, 0.92);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .editor-bar-left {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 14px;
        flex: 1 1 auto;
        min-width: 0;
      }
      .editor-file {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
        margin-left: auto;
      }
      .editor-title {
        font-weight: 600;
        margin-right: 8px;
      }
      .editor-tools button,
      .editor-file button,
      .biome-palette button {
        background: #3a4854;
        border: 1px solid #556570;
        color: inherit;
        padding: 4px 10px;
        border-radius: 4px;
        cursor: pointer;
      }
      .editor-tools button.active,
      .biome-palette button.active {
        background: #5a7a8c;
        border-color: #8ab0c4;
      }
      .biome-palette {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .biome-palette.hidden,
      .entity-palette.hidden,
      .hidden {
        display: none !important;
      }
      .entity-palette {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      #place-asset {
        background: #2a343c;
        color: inherit;
        border: 1px solid #556570;
        border-radius: 4px;
        padding: 3px 6px;
        max-width: 200px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .editor-hint {
        position: fixed;
        left: 50%;
        bottom: 16px;
        z-index: 50;
        transform: translateX(-50%);
        margin: 0;
        padding: 8px 16px;
        max-width: min(92vw, 720px);
        font-size: 11px;
        line-height: 1.4;
        text-align: center;
        color: rgba(232, 224, 212, 0.85);
        background: rgba(12, 10, 24, 0.88);
        border: 1px solid rgba(180, 140, 255, 0.28);
        border-radius: 6px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
        pointer-events: none;
      }
      #map-list {
        background: #2a343c;
        color: inherit;
        border: 1px solid #556570;
        border-radius: 4px;
        padding: 3px 6px;
      }
      #editor-marquee {
        position: fixed;
        z-index: 150;
        pointer-events: none;
        border: 1px solid rgba(200, 170, 255, 0.95);
        background: rgba(180, 140, 255, 0.14);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25) inset;
      }
      #editor-marquee[hidden] {
        display: none !important;
      }
      #editor-toast-host {
        position: fixed;
        top: calc(var(--editor-chrome-height, 52px) + 10px);
        right: 12px;
        z-index: 120;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        pointer-events: none;
        max-width: min(420px, calc(100vw - 24px));
      }
      .editor-toast {
        padding: 10px 14px;
        font-size: 12px;
        line-height: 1.45;
        color: #e8e0d4;
        background: rgba(20, 26, 32, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
        opacity: 0;
        transform: translateY(-6px);
        transition:
          opacity 0.28s ease,
          transform 0.28s ease;
        white-space: pre-line;
      }
      .editor-toast--visible {
        opacity: 1;
        transform: translateY(0);
      }
      .editor-toast--success {
        border-color: rgba(120, 180, 140, 0.45);
      }
      .editor-toast--error {
        border-color: rgba(200, 120, 110, 0.55);
      }
      .editor-toast--info {
        border-color: rgba(140, 170, 200, 0.35);
      }
    </style>
  </head>
  <body>
    <div id="loading">Loading map editor…</div>
    <canvas id="editor"></canvas>
    <script type="module" src="/src/editor/main-editor.ts"></script>
  </body>
</html>
